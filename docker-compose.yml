version: "3"

services:
  api:
    image: "node-api"
    build: ./api
    container_name: "API"
    command: npm start
    restart: always
    ports:
      - "3050:3050"
    volumes:
      - ./api:/usr/api
    links:
      - mongodb
    depends_on:
      - mongodb

  web:
    image: "assistencia-web"
    build: ./web
    container_name: "Web"
    restart: always
    ports:
      - "3000:3000"
    environment:
      # A API é acessada server-side (BFF). Dentro da rede do compose, o host é o
      # nome do serviço "api". Defina SESSION_SECRET no seu .env (ou ambiente).
      - API_URL=http://api:3050
      - SESSION_SECRET=${SESSION_SECRET:-troque-este-segredo-em-producao}
    depends_on:
      - api

  mongodb:
    image: mongo:latest
    container_name: "MongoDB"
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - ./data:/data/db
